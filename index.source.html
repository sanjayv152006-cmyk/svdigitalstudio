    <script>
      // Prevent Vite HMR container websocket errors from triggering unhandled rejection dialogs
      window.addEventListener('unhandledrejection', function(event) {
        try {
          var msg = String(event && event.reason && (event.reason.message || event.reason) || '');
          if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('closed without opened') !== -1) {
            event.preventDefault();
          }
        } catch (e) {}
      });
      window.addEventListener('error', function(event) {
        try {
          var msg = String(event && event.message || '');
          if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('failed to connect to websocket') !== -1) {
            event.preventDefault();
          }
        } catch (e) {}
      });
    </script>
